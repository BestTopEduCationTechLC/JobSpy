name: Scrape jobs for GitHub Pages

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      search_term:
        description: "Job title / keywords to search for (plain text; boolean AND/OR/NOT already resolved by the frontend)"
        required: false
        type: string
      location:
        description: "Location to search in"
        required: false
        type: string
      country_indeed:
        description: "Country for Indeed/Glassdoor (see README for valid names)"
        required: false
        type: string
      site_names:
        description: "Comma-separated sites: indeed,linkedin,google,zip_recruiter,glassdoor,bayt,naukri,bdjobs"
        required: false
        type: string
      results_wanted:
        description: "Number of results per site"
        required: false
        type: string
      hours_old:
        description: "Only jobs posted within this many hours"
        required: false
        type: string
      job_type:
        description: "fulltime, parttime, internship, or contract"
        required: false
        type: string
      is_remote:
        description: "Only remote jobs (true/false)"
        required: false
        type: string
      easy_apply:
        description: "Only easy-apply jobs (true/false)"
        required: false
        type: string
      distance:
        description: "Search radius in miles"
        required: false
        type: string
      run_id:
        description: "Internal: Supabase search_runs.id — set by the frontend, leave blank for manual runs"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      # Only set for a user-triggered private search (came from the frontend via
      # the trigger-scrape Edge Function). Empty for the weekly schedule and for
      # a manual run started directly from the Actions tab.
      RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install jupyter nbconvert pandas

      - name: Update search config from manual trigger
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_SEARCH_TERM: ${{ inputs.search_term }}
          INPUT_LOCATION: ${{ inputs.location }}
          INPUT_COUNTRY_INDEED: ${{ inputs.country_indeed }}
          INPUT_SITE_NAMES: ${{ inputs.site_names }}
          INPUT_RESULTS_WANTED: ${{ inputs.results_wanted }}
          INPUT_HOURS_OLD: ${{ inputs.hours_old }}
          INPUT_JOB_TYPE: ${{ inputs.job_type }}
          INPUT_IS_REMOTE: ${{ inputs.is_remote }}
          INPUT_EASY_APPLY: ${{ inputs.easy_apply }}
          INPUT_DISTANCE: ${{ inputs.distance }}
        run: |
          python - <<'EOF'
          import json
          import os

          path = "scraper/search_config.json"
          with open(path) as f:
              config = json.load(f)

          def apply_str(key, env_name, extra=None):
              value = os.environ.get(env_name, "")
              if value:
                  config[key] = value
                  if extra:
                      extra(value)

          def apply_int(key, env_name):
              value = os.environ.get(env_name, "")
              if value:
                  config[key] = int(value)

          def apply_bool(key, env_name):
              value = os.environ.get(env_name, "")
              if value:
                  config[key] = value.lower() == "true"

          search_term_holder = {}

          def remember_search_term(value):
              search_term_holder["value"] = value

          apply_str("search_term", "INPUT_SEARCH_TERM", remember_search_term)
          apply_str("location", "INPUT_LOCATION")
          apply_str("country_indeed", "INPUT_COUNTRY_INDEED")
          apply_str("site_names", "INPUT_SITE_NAMES")
          apply_int("results_wanted", "INPUT_RESULTS_WANTED")
          apply_int("hours_old", "INPUT_HOURS_OLD")
          apply_str("job_type", "INPUT_JOB_TYPE")
          apply_bool("is_remote", "INPUT_IS_REMOTE")
          apply_bool("easy_apply", "INPUT_EASY_APPLY")
          apply_int("distance", "INPUT_DISTANCE")

          if "value" in search_term_holder:
              location = os.environ.get("INPUT_LOCATION", "") or config["location"]
              config["google_search_term"] = f"{search_term_holder['value']} jobs near {location}"

          with open(path, "w") as f:
              json.dump(config, f, indent=2)
          EOF

      - name: Run scraper notebook
        working-directory: scraper
        run: |
          python - <<'EOF'
          import json

          with open("search_config.json") as f:
              config = json.load(f)

          with open("job_env.sh", "w") as f:
              f.write(f'export SEARCH_TERM="{config["search_term"]}"\n')
              f.write(f'export GOOGLE_SEARCH_TERM="{config["google_search_term"]}"\n')
              f.write(f'export LOCATION="{config["location"]}"\n')
              f.write(f'export COUNTRY_INDEED="{config["country_indeed"]}"\n')
              f.write(f'export SITE_NAMES="{config["site_names"]}"\n')
              f.write(f'export RESULTS_WANTED="{config["results_wanted"]}"\n')
              f.write(f'export HOURS_OLD="{config["hours_old"]}"\n')
              f.write(f'export JOB_TYPE="{config.get("job_type", "")}"\n')
              f.write(f'export IS_REMOTE="{str(config.get("is_remote", False)).lower()}"\n')
              f.write(f'export EASY_APPLY="{str(config.get("easy_apply", False)).lower()}"\n')
              f.write(f'export DISTANCE="{config.get("distance", "")}"\n')
          EOF
          source job_env.sh
          jupyter nbconvert --to notebook --execute --output JOBSCRAPPER.out.ipynb JOBSCRAPPER.ipynb

      - name: Upload private results to Supabase
        if: ${{ env.RUN_ID != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper/upload_results.py scraper/jobs.csv "$RUN_ID"

      - name: Convert results to JSON for the shared frontend view
        if: ${{ env.RUN_ID == '' }}
        run: |
          mkdir -p docs/data
          python scraper/csv_to_json.py scraper/jobs.csv scraper/search_config.json docs/data/jobs.json

      - name: Commit and push updated shared data
        if: ${{ env.RUN_ID == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json scraper/search_config.json
          git diff --cached --quiet || git commit -m "chore: weekly job scrape update"
          git push

      - name: Mark run failed
        if: ${{ failure() && env.RUN_ID != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scraper/mark_run_failed.py "$RUN_ID" "Scrape failed — check run $GITHUB_RUN_ID in the Actions log."
