name: Scrape jobs for GitHub Pages

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      search_term:
        description: "Job title / keywords to search for"
        required: false
        type: string
      location:
        description: "Location to search in"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install jupyter nbconvert pandas

      - name: Update search config from manual trigger
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.search_term != '' || inputs.location != '') }}
        env:
          INPUT_SEARCH_TERM: ${{ inputs.search_term }}
          INPUT_LOCATION: ${{ inputs.location }}
        run: |
          python - <<'EOF'
          import json
          import os

          path = "scraper/search_config.json"
          with open(path) as f:
              config = json.load(f)

          search_term = os.environ.get("INPUT_SEARCH_TERM", "")
          location = os.environ.get("INPUT_LOCATION", "")

          if search_term:
              config["search_term"] = search_term
              config["google_search_term"] = f"{search_term} jobs near {location or config['location']}"
          if location:
              config["location"] = location
              config["country_indeed"] = location

          with open(path, "w") as f:
              json.dump(config, f, indent=2)
          EOF

      - name: Run scraper notebook
        working-directory: scraper
        run: |
          python - <<'EOF'
          import json

          with open("search_config.json") as f:
              config = json.load(f)

          with open("job_env.sh", "w") as f:
              f.write(f'export SEARCH_TERM="{config["search_term"]}"\n')
              f.write(f'export GOOGLE_SEARCH_TERM="{config["google_search_term"]}"\n')
              f.write(f'export LOCATION="{config["location"]}"\n')
              f.write(f'export COUNTRY_INDEED="{config["country_indeed"]}"\n')
              f.write(f'export SITE_NAMES="{config["site_names"]}"\n')
              f.write(f'export RESULTS_WANTED="{config["results_wanted"]}"\n')
              f.write(f'export HOURS_OLD="{config["hours_old"]}"\n')
          EOF
          source job_env.sh
          jupyter nbconvert --to notebook --execute --output JOBSCRAPPER.out.ipynb JOBSCRAPPER.ipynb

      - name: Convert results to JSON for the frontend
        run: |
          mkdir -p docs/data
          python scraper/csv_to_json.py scraper/jobs.csv scraper/search_config.json docs/data/jobs.json

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json scraper/search_config.json
          git diff --cached --quiet || git commit -m "chore: weekly job scrape update"
          git push
